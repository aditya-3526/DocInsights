# ============================================
# Render Blueprint — DocInsights Backend
# ============================================
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: docinsights-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./data/app.db"
      - key: FAISS_INDEX_PATH
        value: "./data/faiss_index"
      - key: UPLOAD_DIR
        value: "./data/uploads"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
